<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba - Lilia Natura</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .btn { padding: 10px 20px; margin: 5px; cursor: pointer; background: #d472a0; color: white; border: none; border-radius: 30px; }
        .producto-item { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Prueba de botones - Lilia Natura</h1>
    
    <div>
        <h2>Agregar Producto de Prueba</h2>
        <input type="text" id="testNombre" placeholder="Nombre del producto">
        <input type="text" id="testPrecio" placeholder="Precio">
        <button class="btn" id="btnTestGuardar">Guardar Producto</button>
        <button class="btn" id="btnTestVideo">Agregar Video</button>
        <button class="btn" id="btnTestCupon">Agregar Cupón</button>
    </div>
    
    <div id="resultados"></div>
    
    <script>
        // Variables locales de prueba
        let productosPrueba = [];
        let videosPrueba = [];
        let cuponesPrueba = [];
        
        // Función para mostrar resultados
        function mostrarResultados() {
            let html = "<h3>Productos guardados:</h3>";
            productosPrueba.forEach(p => { html += `<div class="producto-item">${p.nombre} - ${p.precio}</div>`; });
            html += "<h3>Videos:</h3>";
            videosPrueba.forEach(v => { html += `<div class="producto-item">${v.titulo} - ${v.url}</div>`; });
            html += "<h3>Cupones:</h3>";
            cuponesPrueba.forEach(c => { html += `<div class="producto-item">${c.codigo} - ${c.valor}%</div>`; });
            document.getElementById("resultados").innerHTML = html;
        }
        
        // Botón Guardar Producto
        document.getElementById("btnTestGuardar").onclick = function() {
            let nombre = document.getElementById("testNombre").value.trim();
            let precio = document.getElementById("testPrecio").value.trim();
            if (!nombre || !precio) {
                alert("Completá nombre y precio");
                return;
            }
            productosPrueba.push({ nombre: nombre, precio: precio });
            document.getElementById("testNombre").value = "";
            document.getElementById("testPrecio").value = "";
            mostrarResultados();
            alert("Producto guardado localmente");
        };
        
        // Botón Agregar Video
        document.getElementById("btnTestVideo").onclick = function() {
            let titulo = prompt("Título del video:");
            let url = prompt("URL del video:");
            if (titulo && url) {
                videosPrueba.push({ titulo: titulo, url: url });
                mostrarResultados();
                alert("Video agregado");
            }
        };
        
        // Botón Agregar Cupón
        document.getElementById("btnTestCupon").onclick = function() {
            let codigo = prompt("Código del cupón:");
            let valor = prompt("Valor del descuento:");
            if (codigo && valor) {
                cuponesPrueba.push({ codigo: codigo, valor: valor });
                mostrarResultados();
                alert("Cupón agregado");
            }
        };
        
        mostrarResultados();
    </script>
</body>
</html>
