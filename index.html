<script>
    // Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB4l7EZIsVcZlnKB0H8UH7L3uiJ5ybf6lc",
        authDomain: "lilia-catalogo.firebaseapp.com",
        projectId: "lilia-catalogo",
        storageBucket: "lilia-catalogo.firebasestorage.app",
        messagingSenderId: "846476027363",
        appId: "1:846476027363:web:f85192e2c3022f5bcf6cd6"
    };
    
    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();
    
    const CORREO_PERMITIDO = "brunoromero637@gmail.com";
    
    // Variables globales
    let productos = [];
    let videos = [];
    let cupones = [];
    let carrito = JSON.parse(localStorage.getItem("lilia_carrito") || "[]");
    let cuponAplicado = null;
    let cuponesUsados = JSON.parse(localStorage.getItem("lilia_cupones_usados") || "[]");
    let catalogoNaturaUrl = localStorage.getItem("lilia_catalogo_natura") || "https://ar.natura.digital-catalogue.com/ar/2026/09/revista/natura-ciclo-9/view/index.html";
    let catalogoAvonUrl = localStorage.getItem("lilia_catalogo_avon") || "https://www.avon.com.ar/catalogo";
    let editandoId = null;
    let marcaActual = "all", categoriaActual = "all", generoActual = "all", ordenActual = "nombre", busquedaActual = "";
    
    // ========== FUNCIONES DE UI ==========
    function openImageModal(url) {
        document.getElementById("modalImage").src = url;
        document.getElementById("imageModal").classList.add("show");
    }
    function closeImageModal() {
        document.getElementById("imageModal").classList.remove("show");
    }
    
    // Modo oscuro
    function initDarkMode() {
        const dark = localStorage.getItem("darkMode") === "true";
        if (dark) document.body.classList.add("dark");
        const btn = document.getElementById("darkModeToggle");
        if (btn) {
            btn.textContent = dark ? "☀️" : "🌙";
            btn.onclick = () => {
                document.body.classList.toggle("dark");
                const isDark = document.body.classList.contains("dark");
                localStorage.setItem("darkMode", isDark);
                btn.textContent = isDark ? "☀️" : "🌙";
            };
        }
    }
    
    // Convertir URL de video
    function convertirUrlVideo(url) {
        if (url.includes("dailymotion.com/video/")) {
            let id = url.match(/video\/([a-zA-Z0-9]+)/);
            if (id) return `https://www.dailymotion.com/embed/video/${id[1]}`;
        }
        if (url.includes("youtube.com/watch")) return url.replace("watch?v=", "embed/");
        if (url.includes("youtu.be/")) return `https://www.youtube.com/embed/${url.split("youtu.be/")[1]}`;
        return url;
    }
    
    // Actualizar links de catálogos
    function actualizarLinks() {
        const ln = document.getElementById("catalogoNaturaLink");
        const la = document.getElementById("catalogoAvonLink");
        if (ln) ln.href = catalogoNaturaUrl;
        if (la) la.href = catalogoAvonUrl;
    }
    
    // Guardar links manualmente
    window.guardarLinksManual = function() {
        const n = document.getElementById("linkNaturaInput").value.trim();
        const a = document.getElementById("linkAvonInput").value.trim();
        if (n) { catalogoNaturaUrl = n; localStorage.setItem("lilia_catalogo_natura", n); }
        if (a) { catalogoAvonUrl = a; localStorage.setItem("lilia_catalogo_avon", a); }
        actualizarLinks();
        alert("Links actualizados");
    };
    
    // Carrito
    function actualizarCarritoUI() {
        let count = carrito.reduce((s,i) => s + i.cantidad, 0);
        const cartCount = document.getElementById("cartCount");
        if (cartCount) cartCount.textContent = count;
        
        const cartItems = document.getElementById("cartItems");
        if (carrito.length === 0) {
            if (cartItems) cartItems.innerHTML = "<p style='text-align:center;'>🛒 Carrito vacío</p>";
        } else {
            if (cartItems) {
                cartItems.innerHTML = carrito.map(item => `
                    <div class="cart-item">
                        <div><strong>${item.nombre}</strong><br>${item.precio}</div>
                        <div>
                            <button onclick="actualizarCantidad('${item.id}', ${item.cantidad-1})">-</button>
                            <span style="margin:0 10px;">${item.cantidad}</span>
                            <button onclick="actualizarCantidad('${item.id}', ${item.cantidad+1})">+</button>
                            <button onclick="eliminarDelCarrito('${item.id}')" style="background:#e74c3c; color:white; border:none; border-radius:10px; padding:5px 10px;">X</button>
                        </div>
                    </div>
                `).join('');
            }
        }
        let total = carrito.reduce((s,i) => s + (parseInt(i.precio.replace(/[^0-9]/g,'')) || 0) * i.cantidad, 0);
        if (cuponAplicado) {
            let desc = cuponAplicado.tipo === "porcentaje" ? total * cuponAplicado.valor / 100 : cuponAplicado.valor;
            total = Math.max(0, total - desc);
        }
        const cartTotal = document.getElementById("cartTotal");
        if (cartTotal) cartTotal.innerHTML = `Total: $${total.toLocaleString()}`;
    }
    
    function agregarAlCarrito(id) {
        let p = productos.find(p => p.firestoreId === id);
        if (!p || p.stock <= 0) return;
        let item = carrito.find(i => i.id === id);
        if (item) item.cantidad++;
        else carrito.push({ id: id, nombre: p.nombre, precio: p.precio, cantidad: 1 });
        localStorage.setItem("lilia_carrito", JSON.stringify(carrito));
        actualizarCarritoUI();
    }
    
    function eliminarDelCarrito(id) {
        carrito = carrito.filter(i => i.id !== id);
        localStorage.setItem("lilia_carrito", JSON.stringify(carrito));
        actualizarCarritoUI();
    }
    
    function actualizarCantidad(id, nueva) {
        let item = carrito.find(i => i.id === id);
        if (item) {
            if (nueva <= 0) eliminarDelCarrito(id);
            else { item.cantidad = nueva; localStorage.setItem("lilia_carrito", JSON.stringify(carrito)); actualizarCarritoUI(); }
        }
    }
    
    function comprarAhora(id) {
        let p = productos.find(p => p.firestoreId === id);
        if (!p || p.stock <= 0) { alert("Producto sin stock"); return; }
        p.stock--;
        db.collection("productos").doc(p.firestoreId).update({ stock: p.stock });
        let msg = `PEDIDO LILIA NATURA & AVON%0A%0A- ${p.nombre}%0A   ${p.precio} x 1 = ${p.precio}%0A%0ATOTAL: ${p.precio}%0A%0AHola! Quiero comprar este producto.`;
        window.open(`https://wa.me/?text=${msg}`, '_blank');
        alert("Pedido enviado");
    }
    
    function aplicarCupon() {
        let codigo = document.getElementById("cuponCode").value.trim().toUpperCase();
        let cupon = cupones.find(c => c.codigo === codigo);
        if (!cupon) { alert("Cupón no válido"); return; }
        if (cupon.unico === "si" && cuponesUsados.includes(codigo)) { alert("Ya usaste este cupón"); return; }
        cuponAplicado = cupon;
        document.getElementById("cuponInfo").innerHTML = `✅ Cupón aplicado: ${cupon.codigo} - ${cupon.tipo === "porcentaje" ? cupon.valor + "%" : "$" + cupon.valor} de descuento`;
        actualizarCarritoUI();
    }
    
    function enviarWhatsApp() {
        if (carrito.length === 0) { alert("Carrito vacío"); return; }
        let msg = "PEDIDO LILIA NATURA & AVON%0A%0A";
        let subtotal = 0;
        carrito.forEach(item => {
            let precioNum = parseInt(item.precio.replace(/[^0-9]/g,'')) || 0;
            subtotal += precioNum * item.cantidad;
            msg += `- ${item.nombre}%0A   ${item.precio} x ${item.cantidad} = $${(precioNum * item.cantidad).toLocaleString()}%0A%0A`;
        });
        let total = subtotal;
        if (cuponAplicado) {
            let desc = cuponAplicado.tipo === "porcentaje" ? subtotal * cuponAplicado.valor / 100 : cuponAplicado.valor;
            total = subtotal - desc;
            msg += `Subtotal: $${subtotal.toLocaleString()}%0A`;
            msg += `Cupón ${cuponAplicado.codigo}: -$${Math.round(desc).toLocaleString()}%0A`;
            if (cuponAplicado.unico === "si") {
                cuponesUsados.push(cuponAplicado.codigo);
                localStorage.setItem("lilia_cupones_usados", JSON.stringify(cuponesUsados));
            }
        }
        msg += `TOTAL: $${total.toLocaleString()}%0A%0AHola! Quiero hacer este pedido.`;
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }
    
    // Renderizar
    function renderizarAdmin() {
        let activos = productos.filter(p => p.stock > 0);
        let agotados = productos.filter(p => p.stock === 0);
        const listaActivos = document.getElementById("listaActivos");
        const listaAgotados = document.getElementById("listaAgotados");
        const listaVideosAdmin = document.getElementById("listaVideosAdmin");
        const listaCupones = document.getElementById("listaCupones");
        
        if (listaActivos) {
            listaActivos.innerHTML = activos.map(p => `
                <div class="producto-item">
                    <div><strong>${p.nombre} ${p.destacado ? '⭐' : ''}</strong><br>💰 ${p.precio} | 📦 Stock: ${p.stock} | ${p.marca} - ${p.categoria}</div>
                    <div class="producto-actions">
                        <button class="btn btn-warning" onclick="editarProducto('${p.firestoreId}')">Editar</button>
                        <button class="btn btn-info" onclick="duplicarProducto('${p.firestoreId}')" style="background:#17a2b8; color:white;">Duplicar</button>
                        <button class="btn btn-danger" onclick="eliminarProducto('${p.firestoreId}')">Eliminar</button>
                    </div>
                </div>
            `).join('') || "<p>No hay productos activos</p>";
        }
        
        if (listaAgotados) {
            listaAgotados.innerHTML = agotados.map(p => `
                <div class="producto-item">
                    <div><strong>${p.nombre}</strong><br>💰 ${p.precio} | ⚠️ AGOTADO</div>
                    <div class="producto-actions">
                        <button class="btn btn-warning" onclick="editarProducto('${p.firestoreId}')">Editar</button>
                        <button class="btn btn-info" onclick="duplicarProducto('${p.firestoreId}')" style="background:#17a2b8; color:white;">Duplicar</button>
                        <button class="btn btn-danger" onclick="eliminarProducto('${p.firestoreId}')">Eliminar</button>
                    </div>
                </div>
            `).join('') || "<p>No hay productos agotados</p>";
        }
        
        if (listaVideosAdmin) {
            listaVideosAdmin.innerHTML = videos.map(v => `
                <div class="producto-item">
                    <div><strong>${v.titulo}</strong><br>${v.url.substring(0,50)}</div>
                    <button class="btn btn-danger" onclick="eliminarVideo('${v.firestoreId}')">Eliminar</button>
                </div>
            `).join('') || "<p>No hay videos</p>";
        }
        
        if (listaCupones) {
            listaCupones.innerHTML = cupones.map(c => `
                <div class="producto-item">
                    <div><strong>${c.codigo}</strong><br>${c.tipo === "porcentaje" ? c.valor + "%" : "$" + c.valor} | ${c.unico === "si" ? "Uso único" : "Múltiples usos"}</div>
                    <button class="btn btn-danger" onclick="eliminarCupon('${c.firestoreId}')">Eliminar</button>
                </div>
            `).join('') || "<p>No hay cupones</p>";
        }
    }
    
    function actualizarSubcategorias() {
        const container = document.getElementById("subcategoriasContainer");
        const cats = ["Perfumes", "Jabones", "Cremas", "Maquillaje", "Cabello", "Otros"];
        if (marcaActual === "all") {
            if (container) container.classList.remove("show");
            return;
        }
        if (container) {
            container.classList.add("show");
            container.innerHTML = cats.map(cat => `<button class="cat-btn subcategoria-filtro ${categoriaActual === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`).join('');
            document.querySelectorAll(".subcategoria-filtro").forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll(".subcategoria-filtro").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    categoriaActual = btn.dataset.cat;
                    renderizarPublico();
                };
            });
        }
    }
    
    function renderizarPublico() {
        let filtrados = productos.filter(p => p.stock > 0);
        if (marcaActual !== "all") filtrados = filtrados.filter(p => p.marca === marcaActual);
        if (categoriaActual !== "all") filtrados = filtrados.filter(p => p.categoria === categoriaActual);
        if (generoActual !== "all") filtrados = filtrados.filter(p => p.genero === generoActual);
        if (busquedaActual) filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(busquedaActual.toLowerCase()));
        
        if (ordenActual === "destacado") filtrados.sort((a,b) => (b.destacado ? 1 : 0) - (a.destacado ? 1 : 0));
        else if (ordenActual === "nombre") filtrados.sort((a,b) => a.nombre.localeCompare(b.nombre));
        else if (ordenActual === "precio-menor") filtrados.sort((a,b) => (parseInt(a.precio.replace(/[^0-9]/g,'')) || 0) - (parseInt(b.precio.replace(/[^0-9]/g,'')) || 0));
        else if (ordenActual === "precio-mayor") filtrados.sort((a,b) => (parseInt(b.precio.replace(/[^0-9]/g,'')) || 0) - (parseInt(a.precio.replace(/[^0-9]/g,'')) || 0));
        
        const generoIconos = { Mujer: "👩", Hombre: "👨", Infantil: "🧒", Unisex: "👥" };
        const catalogoPublico = document.getElementById("catalogoPublico");
        const videosPublicos = document.getElementById("videosPublicos");
        
        if (catalogoPublico) {
            catalogoPublico.innerHTML = filtrados.map(p => {
                let desc = null;
                if (p.precioRef) {
                    let pNum = parseInt(p.precio.replace(/[^0-9]/g,'')) || 0;
                    let pRefNum = parseInt(p.precioRef.replace(/[^0-9]/g,'')) || 0;
                    if (pRefNum > pNum) desc = Math.round(((pRefNum - pNum) / pRefNum) * 100);
                }
                return `
                    <div class="producto-card">
                        ${p.destacado ? '<div class="destacado-badge">⭐ Destacado</div>' : ''}
                        ${desc ? `<div class="descuento-badge">-${desc}%</div>` : ''}
                        <div class="genero-badge">${generoIconos[p.genero] || "👩"} ${p.genero}</div>
                        <img class="producto-imagen" src="${p.imagen || 'https://placehold.co/400x300?text=Producto'}" onclick="openImageModal('${p.imagen || 'https://placehold.co/400x300?text=Producto'}')">
                        <div class="producto-info">
                            <div class="producto-nombre">${p.marca} - ${p.nombre}</div>
                            <div class="producto-categoria">${p.categoria}</div>
                            ${p.precioRef ? `<div class="precio-original">Precio ref: ${p.precioRef}</div>` : ''}
                            <div class="producto-precio">${p.precio}</div>
                            <div class="producto-stock">📦 Stock: ${p.stock} unidad${p.stock !== 1 ? 'es' : ''}</div>
                            <div class="botones-container">
                                <button class="btn-carrito" onclick="agregarAlCarrito('${p.firestoreId}')">🛒 Agregar</button>
                                <button class="btn-comprar-ahora" onclick="comprarAhora('${p.firestoreId}')">⚡ Comprar ahora</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            if (filtrados.length === 0) catalogoPublico.innerHTML = "<p style='text-align:center;padding:50px;'>✨ No hay productos disponibles</p>";
        }
        
        if (videosPublicos) {
            videosPublicos.innerHTML = videos.map(v => `
                <div class="video-card" style="background:var(--border-light, #f0f0f0); border-radius:20px; overflow:hidden;">
                    <div style="position:relative; padding-bottom:56.25%;"><iframe src="${convertirUrlVideo(v.url)}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;"></iframe></div>
                    <h4 style="padding:15px;">${v.titulo}</h4>
                </div>
            `).join('') || "<p style='text-align:center;'>No hay videos cargados</p>";
        }
    }
    
    // CRUD Firestore
    async function cargarProductos() {
        const snap = await db.collection("productos").get();
        productos = snap.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
        renderizarPublico();
        renderizarAdmin();
    }
    
    async function cargarVideos() {
        const snap = await db.collection("videos").get();
        videos = snap.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
        renderizarPublico();
        renderizarAdmin();
    }
    
    async function cargarCupones() {
        const snap = await db.collection("cupones").get();
        cupones = snap.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
        renderizarAdmin();
    }
    
    async function guardarProducto(producto) {
        if (producto.firestoreId) {
            const { firestoreId, ...data } = producto;
            await db.collection("productos").doc(firestoreId).update(data);
        } else {
            await db.collection("productos").add(producto);
        }
        await cargarProductos();
    }
    
    async function eliminarProducto(id) {
        if (confirm("¿Eliminar este producto?")) {
            await db.collection("productos").doc(id).delete();
            await cargarProductos();
        }
    }
    
    async function guardarVideo(video) {
        await db.collection("videos").add(video);
        await cargarVideos();
    }
    
    async function eliminarVideo(id) {
        if (confirm("¿Eliminar este video?")) {
            await db.collection("videos").doc(id).delete();
            await cargarVideos();
        }
    }
    
    async function guardarCupon(cupon) {
        await db.collection("cupones").add(cupon);
        await cargarCupones();
    }
    
    async function eliminarCupon(id) {
        if (confirm("¿Eliminar este cupón?")) {
            await db.collection("cupones").doc(id).delete();
            await cargarCupones();
        }
    }
    
    // Formularios
    async function guardarProductoForm() {
        let nombre = document.getElementById("prodNombre").value.trim();
        let marca = document.getElementById("prodMarca").value;
        let genero = document.getElementById("prodGenero").value;
        let categoria = document.getElementById("prodCategoria").value;
        let precio = document.getElementById("prodPrecio").value.trim();
        let precioRef = document.getElementById("prodPrecioRef").value.trim();
        let stock = parseInt(document.getElementById("prodStock").value) || 0;
        let destacado = document.getElementById("prodDestacado").checked;
        let imagen = document.getElementById("prodImagen").value.trim();
        let archivo = document.getElementById("prodImagenFile").files[0];
        if (!nombre || !precio) { alert("Completá nombre y precio"); return; }
        
        if (archivo) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                let prod = { nombre, marca, genero, categoria, precio, precioRef, stock, destacado, imagen: e.target.result };
                if (editandoId) prod.firestoreId = editandoId;
                await guardarProducto(prod);
                limpiarForm();
                alert("Producto guardado");
            };
            reader.readAsDataURL(archivo);
        } else {
            let prod = { nombre, marca, genero, categoria, precio, precioRef, stock, destacado, imagen: imagen || "https://placehold.co/400x300?text=Producto" };
            if (editandoId) prod.firestoreId = editandoId;
            await guardarProducto(prod);
            limpiarForm();
            alert("Producto guardado");
        }
    }
    
    function editarProducto(id) {
        let p = productos.find(p => p.firestoreId === id);
        if (!p) return;
        editandoId = id;
        document.getElementById("prodNombre").value = p.nombre;
        document.getElementById("prodMarca").value = p.marca;
        document.getElementById("prodGenero").value = p.genero;
        document.getElementById("prodCategoria").value = p.categoria;
        document.getElementById("prodPrecio").value = p.precio;
        document.getElementById("prodPrecioRef").value = p.precioRef || "";
        document.getElementById("prodStock").value = p.stock;
        document.getElementById("prodDestacado").checked = p.destacado || false;
        document.getElementById("prodImagen").value = p.imagen || "";
        document.getElementById("btnCancelar").style.display = "inline-block";
        document.getElementById("btnGuardar").textContent = "Actualizar";
    }
    
    async function duplicarProducto(id) {
        let original = productos.find(p => p.firestoreId === id);
        if (!original) return;
        let nuevo = { ...original, nombre: original.nombre + " (Copia)", stock: original.stock };
        delete nuevo.firestoreId;
        await guardarProducto(nuevo);
        alert("Producto duplicado");
    }
    
    function limpiarForm() {
        document.getElementById("prodNombre").value = "";
        document.getElementById("prodPrecio").value = "";
        document.getElementById("prodPrecioRef").value = "";
        document.getElementById("prodStock").value = "";
        document.getElementById("prodDestacado").checked = false;
        document.getElementById("prodImagen").value = "";
        document.getElementById("prodImagenFile").value = "";
        editandoId = null;
        document.getElementById("btnGuardar").textContent = "Guardar";
        document.getElementById("btnCancelar").style.display = "none";
    }
    
    async function agregarVideo() {
        let titulo = document.getElementById("videoTitulo").value.trim();
        let url = document.getElementById("videoUrl").value.trim();
        if (!titulo || !url) { alert("Completá título y URL"); return; }
        await guardarVideo({ titulo, url });
        document.getElementById("videoTitulo").value = "";
        document.getElementById("videoUrl").value = "";
        alert("Video agregado");
    }
    
    async function agregarCupon() {
        let codigo = document.getElementById("cuponCodigo").value.trim().toUpperCase();
        let tipo = document.getElementById("cuponTipo").value;
        let valor = parseInt(document.getElementById("cuponValor").value);
        let unico = document.getElementById("cuponUnico").value;
        if (!codigo || !valor) { alert("Completá código y valor"); return; }
        await guardarCupon({ codigo, tipo, valor, unico });
        document.getElementById("cuponCodigo").value = "";
        document.getElementById("cuponValor").value = "";
        alert("Cupón agregado");
    }
    
    // Login
    window.loginWithGoogle = async function() {
        try {
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            if (user.email === CORREO_PERMITIDO) {
                localStorage.setItem("admin_logged", "true");
                location.reload();
            } else {
                alert("Acceso denegado");
                await auth.signOut();
            }
        } catch (error) {
            alert("Error: " + error.message);
        }
    };
    
    window.logoutUser = async function() {
        await auth.signOut();
        localStorage.removeItem("admin_logged");
        location.reload();
    };
    
    // Inicialización
    document.addEventListener("DOMContentLoaded", async () => {
        initDarkMode();
        actualizarLinks();
        await cargarProductos();
        await cargarVideos();
        await cargarCupones();
        
        // Tabs
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
                btn.classList.add("active");
                document.getElementById(btn.dataset.tab).classList.add("active");
            };
        });
        
        // Filtros
        document.querySelectorAll("[data-marca]").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll("[data-marca]").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                marcaActual = btn.dataset.marca;
                categoriaActual = "all";
                generoActual = "all";
                actualizarSubcategorias();
                renderizarPublico();
            };
        });
        
        document.querySelectorAll("[data-genero]").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll("[data-genero]").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                generoActual = btn.dataset.genero;
                renderizarPublico();
            };
        });
        
        document.getElementById("ordenSelect").onchange = (e) => { ordenActual = e.target.value; renderizarPublico(); };
        document.getElementById("searchInput").oninput = (e) => { busquedaActual = e.target.value; renderizarPublico(); };
        document.getElementById("cartBtn").onclick = () => document.getElementById("cartSidebar").classList.add("open");
        document.getElementById("closeCart").onclick = () => document.getElementById("cartSidebar").classList.remove("open");
        document.getElementById("whatsappBtn").onclick = enviarWhatsApp;
        document.getElementById("aplicarCuponBtn").onclick = aplicarCupon;
        
        // ⭐ BOTONES CORREGIDOS ⭐
        const btnGuardar = document.getElementById("btnGuardar");
        const btnAddVideo = document.getElementById("btnAddVideo");
        const btnAgregarCupon = document.getElementById("btnAgregarCupon");
        const btnCancelar = document.getElementById("btnCancelar");
        const guardarLinksBtn = document.getElementById("guardarLinksBtn");
        
        if (btnGuardar) btnGuardar.onclick = guardarProductoForm;
        if (btnAddVideo) btnAddVideo.onclick = agregarVideo;
        if (btnAgregarCupon) btnAgregarCupon.onclick = agregarCupon;
        if (btnCancelar) btnCancelar.onclick = limpiarForm;
        if (guardarLinksBtn) guardarLinksBtn.onclick = () => window.guardarLinksManual();
        
        // Auth state
        auth.onAuthStateChanged((user) => {
            const adminPanel = document.getElementById("adminPanel");
            const btnLogin = document.getElementById("googleLoginBtn");
            const btnLogout = document.getElementById("btnLogout");
            const userEmail = document.getElementById("userEmailDisplay");
            if (user && user.email === CORREO_PERMITIDO) {
                if (adminPanel) adminPanel.classList.add("show");
                if (btnLogin) btnLogin.style.display = "none";
                if (btnLogout) btnLogout.style.display = "inline-block";
                if (userEmail) userEmail.innerHTML = user.email;
                const ln = document.getElementById("linkNaturaInput");
                const la = document.getElementById("linkAvonInput");
                if (ln) ln.value = catalogoNaturaUrl;
                if (la) la.value = catalogoAvonUrl;
            } else {
                if (adminPanel) adminPanel.classList.remove("show");
                if (btnLogin) btnLogin.style.display = "block";
                if (btnLogout) btnLogout.style.display = "none";
            }
        });
        
        actualizarSubcategorias();
        actualizarCarritoUI();
        
        window.agregarAlCarrito = agregarAlCarrito;
        window.eliminarDelCarrito = eliminarDelCarrito;
        window.actualizarCantidad = actualizarCantidad;
        window.editarProducto = editarProducto;
        window.eliminarProducto = eliminarProducto;
        window.duplicarProducto = duplicarProducto;
        window.eliminarVideo = eliminarVideo;
        window.eliminarCupon = eliminarCupon;
        window.openImageModal = openImageModal;
        window.closeImageModal = closeImageModal;
    });
</script>
